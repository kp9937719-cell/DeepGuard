<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – DeepGuard</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { background: var(--bg-primary); display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent), var(--bg-secondary)); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }
    .auth-logo h1 { font-family: 'Manrope',sans-serif; font-size: 26px; font-weight: 800; color: var(--text-light); }
    .auth-logo p { color: var(--text-muted); font-size: 13px; }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-muted); font-size: 12px; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DeepGuard Logo" style="height:70px;width:auto;border-radius:12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.4);border:1px solid var(--border-color);">
    <h1>Welcome Back</h1>
    <p>Sign in to your DeepGuard account</p>
  </div>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert" style="background:rgba(133,79,108,0.15);border:1px solid var(--accent);color:var(--highlight);border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="mb-3">
      <label class="form-label"><i class="fa-solid fa-envelope me-2"></i>Email Address</label>
      <input type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="mb-3">
      <label class="form-label"><i class="fa-solid fa-lock me-2"></i>Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" name="remember" style="accent-color:var(--accent);"> <span style="font-size:13px;color:var(--text-muted);">Remember me</span>
      </label>
      <a href="{{ url_for('auth.forgot_password') }}" style="font-size:13px;color:var(--highlight);">Forgot password?</a>
    </div>
    <button type="submit" class="btn-dg w-100" style="justify-content:center;padding:12px;">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="auth-divider">or</div>
  <div style="text-align:center;font-size:13px;color:var(--text-muted);">
    Don't have an account?
    <a href="{{ url_for('auth.register') }}" style="color:var(--highlight);font-weight:600;"> Create one</a>
  </div>
  <div style="text-align:center;margin-top:20px;">
    <a href="{{ url_for('index') }}" style="font-size:12px;color:var(--text-muted);">← Back to home</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
